name: Verify and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sharhan-portfolio-hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm run lint
          npm run build

      - name: Build and smoke-test production image
        run: |
          docker build --tag sharhan-portfolio:ci .
          docker run --detach --name sharhan-portfolio-ci --publish 127.0.0.1:3000:3000 sharhan-portfolio:ci
          trap 'docker rm --force sharhan-portfolio-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs sharhan-portfolio-ci
          exit 1

      - name: Validate Hostinger deployment contract
        run: bash scripts/verify/hostinger-deployment.sh

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy Compose project through Hostinger
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ secrets.HOSTINGER_VM_ID }}
          project-name: sharhan-portfolio
          docker-compose-path: docker-compose.production.yml
